[project]
name = "mcpack"
version = "1.0.0"
description = "Minecraft mod paket yöneticisi - Modrinth/CurseForge arama, pack oluşturma, mrpack/CurseForge/Prism export, server pack üretimi ve SKLauncher entegrasyonu"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.20",
]

[project.scripts]
mcpack = "mcpack.main:main"
mcpack-cli = "mcpack.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
